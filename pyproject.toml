[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "positronixlab"
version="0.1.3"
description = "A comprehensive framework to explore modularity of neural networks"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Cesare Montresor" },
]
keywords = [
    "pytorch",
    "neural-networks",
    "modularity",
    "mechanistic-interpretability",
    "subnetworks",
    "clustering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "torchvision",
    "numpy>=1.24",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "tqdm",
    "faiss-cpu",
    "torchsummary",
    "pandas",
    "requests",
    "parallelazy",
]

[project.optional-dependencies]
ui = [
    "dash",
    "plotly",
    "dash-bootstrap-components",
    "dash-bootstrap-templates",
    "dash-cytoscape",
    "flask",
    "werkzeug",
]
nas = [
    "ax-platform>=1.3",
]
umap = [
    "umap-learn",
]
baselines = [
    "NeuroSurgeon",
    "transformers",
    "opencv-python-headless",
    "pillow",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "mypy",
    "pyright",
]
all = [
    "positronixlab[ui,nas,umap,baselines]",
]

[project.urls]
Homepage = "https://github.com/cesare-montresor/PositronixLab"
Repository = "https://github.com/cesare-montresor/PositronixLab"
Issues = "https://github.com/cesare-montresor/PositronixLab/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["positronixlab*"]

[tool.setuptools.package-data]
positronixlab = [
    "py.typed",
    "**/*.css",
    "**/*.md",
]



[tool.ruff]
target-version = "py312"
include = ["positronixlab/**/*.py"]
exclude = ["positronixlab/baselines/lepori/_cvr_gen"]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes (logic errors)
    "E4",   # pycodestyle imports
    "E7",   # pycodestyle statements
    "E9",   # pycodestyle runtime/syntax
    "I",    # isort (deterministic import sorting)
    "UP",   # pyupgrade (enforces Python 3.11+ syntax)
    "B",    # flake8-bugbear (catches common bugs and anti-patterns)
]
ignore = [
    "UP038", # isinstance with tuple is faster than union syntax
]

[tool.ruff.lint.per-file-ignores]
"positronixlab/dataprovider/__init__.py" = ["F401"]
"positronixlab/nas/__init__.py" = ["F401"]
"positronixlab/baselines/lepori/_cvr_gen/**" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["positronixlab"]
exclude = ["positronixlab/baselines/lepori/_cvr_gen/"]
ignore_missing_imports = true
show_error_codes = true

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["positronixlab"]
exclude = ["positronixlab/baselines/lepori/_cvr_gen"]
typeCheckingMode = "basic"
reportMissingImports = "warning"

