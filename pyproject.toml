[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "positronixlab"
version="0.1.2"
description = "A comprehensive framework to explore modularity of neural networks"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Cesare Montresor" },
]
keywords = [
    "pytorch",
    "neural-networks",
    "modularity",
    "mechanistic-interpretability",
    "subnetworks",
    "clustering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "torchvision",
    "numpy>=1.24",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "tqdm",
    "faiss-cpu",
    "torchsummary",
    "pandas",
    "requests",
    "parallelazy",
]

[project.optional-dependencies]
ui = [
    "dash",
    "plotly",
    "dash-bootstrap-components",
    "dash-bootstrap-templates",
    "dash-cytoscape",
    "flask",
    "werkzeug",
]
nas = [
    "ax-platform>=1.3",
]
umap = [
    "umap-learn",
]
baselines = [
    "NeuroSurgeon",
    "transformers",
    "opencv-python-headless",
    "pillow",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "build",
    "twine",
]
all = [
    "positronixlab[ui,nas,umap,baselines]",
]

[project.urls]
Homepage = "https://github.com/cesare-montresor/PositronixLab"
Repository = "https://github.com/cesare-montresor/PositronixLab"
Issues = "https://github.com/cesare-montresor/PositronixLab/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["positronixlab*"]

[tool.setuptools.package-data]
positronixlab = [
    "py.typed",
    "**/*.css",
    "**/*.md",
]
