[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modularnet"
dynamic = ["version"]
description = "A complete framework to explore functional modularity for neural networks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "matplotlib",
    "dash",
    "plotly",
    "numpy",
    "scikit-learn",
    "tk",
    "hdbscan",
    "einops",
    "scikit-image",
    "tqdm",
    "wandb",
    "kneed",
    "torchsummary",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "kaleido",
    "tabulate",
    "faiss-cpu",
    "ax-platform"
    "dash_bootstrap_components",
    "dash_bootstrap_templates",
    "dash-cytoscape",
    "dash-draggable",
    "cuml-cu12",
    "parametric_umap",
    "ax-platform"
]


[tool.setuptools.dynamic]
version = {attr = "modularnet.__version__"}



[tool.setuptools.packages.find]
where = ["."]
include = ["modularnet*"]
