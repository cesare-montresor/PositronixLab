name: Publish Release

on:
  push:
    branches:
      - "release"

permissions:
  contents: write

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required to check existing tags before building
          fetch-tags: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version, check tag, and resolve changelog
        id: check_version
        run: |
          VERSION=$(python -c "
          import ast, pathlib, tomllib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          ver = data.get('project', {}).get('version')
          if not ver:
              tree = ast.parse(pathlib.Path('positronixlab/__init__.py').read_text())
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      for t in node.targets:
                          if isinstance(t, ast.Name) and t.id == '__version__':
                              ver = ast.literal_eval(node.value)
          assert ver, 'Could not resolve package version'
          print(ver)
          ")
          TAG_NAME="v$VERSION"
          CHANGELOG_FILE="changelogs/$TAG_NAME.md"

          echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Tag $TAG_NAME already exists! Pipeline aborted to prevent duplicate publish."
            exit 1
          fi

          if [ -f "$CHANGELOG_FILE" ]; then
            echo "changelog_file=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"
            echo "generate_notes=false" >> "$GITHUB_OUTPUT"
            if [ -f "./changelogs/changelog.sh" ]; then
              if ! bash ./changelogs/changelog.sh --check; then
                echo "::warning::Changelog check failed for $TAG_NAME; continuing release anyway."
              fi
            fi
          else
            echo "::notice::No changelog file found at $CHANGELOG_FILE; using auto-generated release notes."
            echo "changelog_file=" >> "$GITHUB_OUTPUT"
            echo "generate_notes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Create GitHub Release and Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.version }}
          name: Release ${{ steps.check_version.outputs.version }}
          body_path: ${{ steps.check_version.outputs.changelog_file }}
          generate_release_notes: ${{ steps.check_version.outputs.generate_notes }}
          files: dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
